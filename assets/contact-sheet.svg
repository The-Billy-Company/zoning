<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 720 420" width="720" height="420" role="img"
     aria-labelledby="title description">
  <title id="title">Zoning identity concept contact sheet</title>
  <desc id="description">Three pixel-grid concepts rendered at 16, 24, and 32 pixels on light and dark backgrounds.</desc>

  <rect width="360" height="420" fill="#f3f5f7"/>
  <rect x="360" width="360" height="420" fill="#16191d"/>
  <g font-family="ui-monospace, monospace" font-size="12" font-weight="600" letter-spacing=".8">
