    <use xlink:href="concepts/sealed-doorway.svg#mark" x="90" y="210" width="24" height="24"/>
    <use xlink:href="concepts/sealed-doorway.svg#mark" x="158" y="206" width="32" height="32"/>
    <use xlink:href="concepts/protected-contour.svg#mark" x="30" y="328" width="16" height="16"/>
    <use xlink:href="concepts/protected-contour.svg#mark" x="90" y="324" width="24" height="24"/>
    <use xlink:href="concepts/protected-contour.svg#mark" x="158" y="320" width="32" height="32"/>
