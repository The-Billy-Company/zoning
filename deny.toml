# cargo-deny config (schema v2, cargo-deny 0.19 or newer).
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2

# This list is a policy - the licenses this project accepts - not a snapshot of
# what today's dependency graph happens to pull. Most of it goes unmatched at
# any given moment, and cargo-deny warns once per unused entry, which would
# make a clean run look like five findings. Shrinking the list to silence that
# would invert the point: the next permissively-licensed crate would fail CI
# and get "fixed" by widening the list again, one entry at a time, with nobody
# deciding anything. Matches the policy every sibling repo in this org shares,
# plus Unlicense for `memchr`.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

# The judge parses untrusted trees and talks to an editor over stdio. Neither
# of those is a reason to link TLS, pull in an async runtime, or carry a
# mocking framework - each would be a design mistake wearing a dependency.
[[bans.deny]]
name = "openssl-sys"
reason = "An import-topology judge and its LSP server have no business linking TLS."

[[bans.deny]]
name = "native-tls"
reason = "An import-topology judge and its LSP server have no business linking TLS."

[[bans.deny]]
name = "mockall"
reason = "The judge is the thing under test; there is nothing here to mock."

[[bans.deny]]
name = "tokio"
reason = "lsp-server's transport is a synchronous stdio loop, not an async runtime."

[[bans.deny]]
name = "async-std"
reason = "lsp-server's transport is a synchronous stdio loop, not an async runtime."

[sources]
unknown-registry = "warn"
unknown-git = "warn"
