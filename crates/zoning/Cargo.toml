[package]
name = "zoning"
description = "An import-topology gate: declare the zones a package's imports may cross, and judge the real import graph against them."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The judge remains std-only. The executable also carries an in-process language
# server, whose protocol boundary is delegated to this narrow, MSRV-checked set.
[dependencies]
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lib]
name = "zoning"
path = "src/lib.rs"

[[bin]]
name = "zoning"
path = "src/main.rs"

[lints]
workspace = true
