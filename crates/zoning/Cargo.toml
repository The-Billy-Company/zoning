[package]
name = "zoning"
description = "An import-topology gate: declare the zones a package's imports may cross, and judge the real import graph against them."
readme = "../../README.md"
# `LICENSE` and `NOTICE` are copies of the repository root's, kept in this directory
# rather than reached for upward the way `readme` is: Cargo relocates a `readme` from
# outside the package but packages nothing else from there, so without the copies an
# Apache-2.0 crate shipped no license text and no attribution notice at all - the two
# things section 4 of that license requires a redistributor to hand on. Keep them
# byte-identical to the root pair.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The graph laws remain std-only. Source and protocol parsing use their owners'
# structured parsers rather than recreating Rust, TOML or LSP in the judge.
[dependencies]
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
syn = { version = "3.0.3", features = [ "full", "visit", "extra-traits" ] }
proc-macro2 = { version = "1.0.107", features = [ "span-locations" ] }
toml = "0.9.12"
process-wrap = { version = "=11.0.0", default-features = false, features = [
  "std",
  "process-group",
  "job-object",
  "kill-on-drop",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "zoning"
path = "src/lib.rs"

[[bin]]
name = "zoning"
path = "src/main.rs"

# Same binary, second name: `zone` is the taught command, `zoning` is the
# convenience alias people already have muscle memory (and the crate name)
# for. Two [[bin]] entries pointing at one main.rs are two compiles of
# identical source, never two implementations to keep in sync.
[[bin]]
name = "zone"
path = "src/main.rs"

[lints]
workspace = true
