[workspace]
resolver = "3"
members = ["crates/zoning"]

[workspace.package]
version = "1.1.0"                                                                 # x-release-please-version
edition = "2024"
# 1.88 is where `let` chains stabilized. Three of them read better than the
# nested `if`s they replace, and a floor a year old is not a barrier for a
# tool most people will install as a prebuilt wheel rather than compile.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/The-Billy-Company/zoning"
homepage = "https://github.com/The-Billy-Company/zoning"
authors = ["Griffin Strier <griffin@billylives.com>"]
keywords = ["architecture", "lint", "imports", "dependencies", "zig"]
categories = ["development-tools", "development-tools::build-utils"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The judged corpus is a source tree; counts are small and always fit.
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
# Every fallible path in this tool returns a diagnostic a human reads.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
