name: release

# One tag, both registries. crates.io and PyPI carry the same program built from
# the same commit, so the only way they can disagree about what `zoning 1.0.0`
# means is if this workflow half-fails - which is why the publish jobs run last
# and only after every wheel in the matrix exists. They are siblings, not steps
# in one job: the registries fail independently, and a wheel that already
# uploaded must not be rolled back because a crate upload failed, nor the
# reverse.
#
# `preflight` runs the shared org release contract before any of that: the
# tag names the version Cargo.toml declares, changelog.d/ was folded with an
# exact `## [X.Y.Z]` heading, `release-ready` was green on this exact commit,
# and the commit is reachable from `main`. A maintainer prepares a release by
# merging the release-please PR (release-please.yml), which already folded
# the changelog and bumped the version, and cuts the GitHub Release itself the
# moment that PR merges — this workflow only ever publishes the two registries.
#
# ONE-TIME SETUP, both registries use Trusted Publishing so there is no API
# token here to rotate or leak:
#   - PyPI: add a trusted publisher for the `zoning` project pointing at this
#     repository, workflow `release.yml`, environment `pypi`. Before the project
#     exists this is a "pending publisher" under Your projects -> Publishing.
#   - crates.io: add a trusted publisher to this crate pointing at this
#     repository, workflow `release.yml`, environment `crates-io`. crates.io
#     requires the crate to exist first, so 0.1.0 was published by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The shared release contract (`release.toml` + the org's `package-release`
  # action), run once before anything is built: is the tag the version
  # `Cargo.toml` declares, is the changelog folded with the exact
  # `## [X.Y.Z]` heading and no fragment left un-folded, did `release-ready`
  # go green on this exact commit, and is this commit actually reachable from
  # `main`? Every step below is conditioned on an actual tag, so a
  # `workflow_dispatch` dry run (no tag) passes through as a no-op and
  # `wheels`/`sdist` still run unpublished.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@deb135f046122a10cabc861e96eb9941c2d09ddc # main
        with:
          command: version
          args: --root . --tag ${{ github.ref_name }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@deb135f046122a10cabc861e96eb9941c2d09ddc # main
        with:
          command: changelog
          args: >-
            --root . --require-fragments-empty
            --version ${{ fromJSON(steps.version.outputs.result).version }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@deb135f046122a10cabc861e96eb9941c2d09ddc # main
        with:
          command: tag-ancestor
          args: ${{ github.repository }} ${{ github.sha }} --branch main
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@deb135f046122a10cabc861e96eb9941c2d09ddc # main
        with:
          command: ci-status
          args: ${{ github.repository }} ${{ github.sha }}

  # A wheel per platform, plus one sdist. maturin cross-compiles the Linux
  # targets in a manylinux container, so the published wheels run on CI images
  # older than this runner - which matters more than usual here, because the
  # thing consuming these wheels IS someone else's CI.
  wheels:
    needs: preflight
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sdist:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  editor:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the deterministic Cursor and VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
          git diff --exit-code -- ../../crates/zoning/src/setup/payload/zoning.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zoning-vsix
          path: crates/zoning/src/setup/payload/zoning.vsix
          if-no-files-found: error

  pypi:
    # Only a tag publishes. A manual run builds and verifies and stops there.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, wheels, sdist, editor]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The OIDC token Trusted Publishing exchanges for an upload credential.
      id-token: write
    steps:
      # Named explicitly, not by a blanket "every artifact this run produced":
      # `editor` also uploads `zoning-vsix`, which is not a PyPI distribution
      # format, and `gh-action-pypi-publish` refuses the whole batch the
      # instant one file in `dist/` doesn't parse as a wheel or sdist.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: "wheel-*"
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: dist
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Probed before the OIDC token is minted, the same idempotency the
      # `crates` job proves below: a retry after a flake, or a dispatch on a
      # tag that already shipped, must land on "already there" rather than
      # spend a credential on an upload PyPI will reject anyway.
      - id: probe
        uses: The-Billy-Company/.github/actions/package-release@deb135f046122a10cabc861e96eb9941c2d09ddc # main
        with:
          command: registry-probe
          args: pypi zoning ${{ steps.tag.outputs.version }}
      - name: probe answered
        env:
          STATE: ${{ steps.probe.outputs.result }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$STATE" = error ]; then
            echo "::error::PyPI did not answer for zoning $VERSION —" \
                 "a network failure is never treated as \"absent\"." >&2
            exit 1
          fi
          echo "zoning $VERSION on PyPI: $STATE"
      - if: steps.probe.outputs.result == 'absent'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  crates:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, wheels, sdist, editor]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write # crates.io exchanges this OIDC token for a short-lived registry token.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Asked before a credential is minted, not after a failed upload. A retry
      # after a flake, or a dispatch on an existing tag, must not fail because
      # the version is already on the index - a published version is immutable
      # there, so "already present" is success. An "error" probe (registry
      # unreachable) is a hard fail: it must never be read as "absent" and
      # re-published blind.
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: probe
        uses: The-Billy-Company/.github/actions/package-release@deb135f046122a10cabc861e96eb9941c2d09ddc # main
        with:
          command: registry-probe
          args: crates zoning ${{ steps.tag.outputs.version }}
      - name: probe answered
        env:
          STATE: ${{ steps.probe.outputs.result }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$STATE" = error ]; then
            echo "::error::crates.io did not answer for zoning $VERSION —" \
                 "a network failure is never treated as \"absent\"." >&2
            exit 1
          fi
          echo "zoning $VERSION on crates.io: $STATE"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: steps.probe.outputs.result == 'absent'
      - name: Publish
        if: steps.probe.outputs.result == 'absent'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p zoning --locked
