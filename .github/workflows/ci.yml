name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The soak only. Everything else is already proven per commit.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # A property failure prints the seed that produced it; a backtrace says where.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-features

  # The tool judging itself. zoning's own tree is Rust, so there is no `.zone`
  # contract to check here yet; what this proves is that the binary runs, parses
  # a real contract, and exits the way a gate must.
  dogfood:
    name: judge a real contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo build --release
      # `--root` rather than a `cd`: with no root given, zoning climbs to the
      # enclosing git worktree, which for a fixture nested in this repo is this
      # repo - so every box would report "no package declares a contract" and
      # exit 0, and the whole loop would pass by finding nothing. Naming the
      # root is what makes each box its own package.
      - name: fixtures pass, and their mutations fail
        run: |
          set -euo pipefail
          Z=target/release/zoning
          for box in tests/fixtures/pass/*/; do
            echo "::group::$box"
            "$Z" verify --untracked --root "$box"
            echo "::endgroup::"
          done
          for box in tests/fixtures/fail/*/; do
            echo "::group::$box"
            if "$Z" verify --untracked --root "$box"; then
              echo "::error::$box was expected to fail and did not"
              exit 1
            fi
            echo "::endgroup::"
          done

  # A binary people install into their CI must build where their CI runs.
  portability:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --release

  # The PyPI half is the same binary in a different envelope, and the envelope is
  # what most consumers actually touch: a sibling repo's CI asks for
  # `uvx zoning verify`, not for a Rust toolchain. So the wheel is built and its
  # console script is *run* on every commit - a wheel that installs but whose
  # entry point does not resolve is the failure this catches, and it is invisible
  # to `cargo test`.
  wheel:
    name: wheel · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Build
        run: uv run --no-project --with 'maturin>=1.9,<2.0' maturin build --release --out dist
      - name: The installed console script judges a fixture
        shell: bash
        run: |
          set -euo pipefail
          cd tests/fixtures/pass/layered
          uv run --no-project --with "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)" zoning verify --untracked
      - name: Metadata is publishable
        run: uv run --no-project --with 'twine>=6' twine check dist/*

  editors:
    name: editor payload · LSP adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - name: Cursor and VS Code
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
          git diff --exit-code -- ../../crates/zoning/src/setup/payload/zoning.vsix
      - name: Zed grammar
        working-directory: editors/zed/grammar
        run: |
          npm ci
          npm test
      - name: Zed extension
        run: cargo check --locked --manifest-path editors/zed/Cargo.toml --target wasm32-wasip1
      - name: Vim runtime
        run: vim -Nu NONE -n -es -S editors/vim/test/runtime.vim
      - name: Embedded package still compiles
        run: cargo check --locked

  # The per-commit suite runs a few hundred generated packages, which is sized to keep a
  # PR fast rather than to search hard. This runs the same code at fifty times the case
  # count, in release, from a seed nobody has used before - the run id - so each night
  # covers ground the last one did not. A failure prints `ZONING_SEED=…`, and pasting that
  # in front of `cargo test` replays it exactly, which is the only part of shrinking that
  # matters at this size.
  #
  # Deliberately outside `release-ready`: a soak that found something new must not
  # retroactively block a tag on a commit that was green when it was cut. It opens no PR
  # and pages nobody - the failure is in the run log, where the next person to look at the
  # schedule will find it.
  soak:
    if: github.event_name != 'pull_request'
    name: soak the generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: properties and fuzz, wider and from a fresh seed
        env:
          ZONING_CASES: "5000"
          ZONING_SEED: ${{ github.run_id }}
        run: cargo test --release --test properties --test fuzz

  # These files are the only thing here that nothing else type-checks. A
  # workflow with an expression in a place the context is not available does not
  # fail a job - it fails to schedule any job at all, and the run reports
  # "workflow file issue" with no log to read. So the linters run against them
  # too: actionlint for the schema and expression contexts, zizmor for the
  # security posture (unpinned actions, credential persistence, injection).
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --no-project --with zizmor==1.29.0 zizmor --no-online-audits --strict-collection .
      - uses: docker://rhysd/actionlint:1.7.7

  # Fragment names/types/bodies parse, and towncrier's own draft render is
  # non-vacuous — proven on every PR rather than discovered at tag time, when
  # a malformed `changelog.d/` entry is far more expensive to fix.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: The-Billy-Company/.github/actions/package-release@deb135f046122a10cabc861e96eb9941c2d09ddc # main
        with:
          command: changelog
          args: --root .

  # A one-entry matrix rather than `env`, because a job's `name` cannot read the
  # `env` context - so this is the only shape where the floor version appears
  # once and drives both the toolchain and the check name you read in the UI.
  msrv:
    name: rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.88"] # keep in step with rust-version in Cargo.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo check --all-features

  # The one check `release.yml`'s preflight polls for on the exact tagged
  # commit (`release.toml`'s `[ci].required_check`). Everything above feeds
  # into it, so a red job blocks the tag rather than the publish workflow
  # discovering it minutes into a wheel build. `if: always()` is required —
  # the default `if` on a job would skip this one the moment anything
  # upstream failed, which is exactly the case it has to report on.
  release-ready:
    if: always()
    needs: [check, dogfood, portability, wheel, editors, actions, msrv, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: every required job is green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -c "
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          failed = sorted(name for name, info in needs.items() if info['result'] != 'success')
          if failed:
              raise SystemExit(f'not release-ready: {failed} did not succeed')
          print(f'release-ready: {len(needs)} required jobs all succeeded')
          "
