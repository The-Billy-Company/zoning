name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-features

  # The tool judging itself. zoning's own tree is Rust, so there is no `.zone`
  # contract to check here yet; what this proves is that the binary runs, parses
  # a real contract, and exits the way a gate must.
  dogfood:
    name: judge a real contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo build --release
      - name: fixtures pass, and their mutations fail
        run: |
          set -euo pipefail
          Z=target/release/zoning
          for box in tests/fixtures/pass/*/; do
            echo "::group::$box"
            (cd "$box" && "$GITHUB_WORKSPACE/$Z" verify --untracked)
            echo "::endgroup::"
          done
          for box in tests/fixtures/fail/*/; do
            echo "::group::$box"
            if (cd "$box" && "$GITHUB_WORKSPACE/$Z" verify --untracked); then
              echo "::error::$box was expected to fail and did not"
              exit 1
            fi
            echo "::endgroup::"
          done

  # A binary people install into their CI must build where their CI runs.
  portability:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --release

  # The PyPI half is the same binary in a different envelope, and the envelope is
  # what most consumers actually touch: a sibling repo's CI asks for
  # `uvx zoning verify`, not for a Rust toolchain. So the wheel is built and its
  # console script is *run* on every commit - a wheel that installs but whose
  # entry point does not resolve is the failure this catches, and it is invisible
  # to `cargo test`.
  wheel:
    name: wheel · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Build
        run: uv run --no-project --with 'maturin>=1.9,<2.0' maturin build --release --out dist
      - name: The installed console script judges a fixture
        shell: bash
        run: |
          set -euo pipefail
          cd tests/fixtures/pass/layered
          uv run --no-project --with "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)" zoning verify --untracked
      - name: Metadata is publishable
        run: uv run --no-project --with 'twine>=6' twine check dist/*

  # These files are the only thing here that nothing else type-checks. A
  # workflow with an expression in a place the context is not available does not
  # fail a job - it fails to schedule any job at all, and the run reports
  # "workflow file issue" with no log to read. So the linters run against them
  # too: actionlint for the schema and expression contexts, zizmor for the
  # security posture (unpinned actions, credential persistence, injection).
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --no-project --with zizmor==1.29.0 zizmor --no-online-audits --strict-collection .
      - uses: docker://rhysd/actionlint:1.7.7

  # A one-entry matrix rather than `env`, because a job's `name` cannot read the
  # `env` context - so this is the only shape where the floor version appears
  # once and drives both the toolchain and the check name you read in the UI.
  msrv:
    name: rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.85"] # keep in step with rust-version in Cargo.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo check --all-features
