# Open (and keep updating) a release PR from the conventional commits on main.
#
# The PR bumps `Cargo.toml` (the sole `x-release-please-version` mirror —
# `crates/zoning/Cargo.toml` and `pyproject.toml` both read the version
# through it rather than restating it). Merging the PR tags `vX.Y.Z` and cuts
# a GitHub Release. Nothing here publishes: `release.yml` does that,
# triggered by the tag.
#
# ── Two things worth knowing before the first release
#
# 1. towncrier, not release-please, owns CHANGELOG.md — the curated fragments
#    under changelog.d/ are the notes people actually read, so the config sets
#    `skip-changelog`. The `fold changelog` job below folds them into
#    CHANGELOG.md at the exact version this PR bumps to and pushes that onto
#    the PR branch; it re-runs on every push to main while the PR stays open,
#    so the fold never falls behind whatever fragments are on the branch when
#    someone finally merges. `release.yml`'s preflight re-checks the fold
#    landed before it will publish anything.
#
# 2. This runs as a GitHub App, not as Actions, and it has to. Two independent
#    walls make the default GITHUB_TOKEN useless here: the enterprise forbids the
#    Actions identity from creating pull requests at all, and a tag GITHUB_TOKEN
#    pushes does not start another workflow (GitHub's recursive-CI guard), so
#    `release.yml` would never fire and the wheels/crate would need publishing
#    by hand. An installation token is a different actor and clears both. The
#    App is `billy-company-release`; its identifier is the org variable
#    RELEASE_APP_CLIENT_ID and its signing key the org secret
#    RELEASE_APP_PRIVATE_KEY, shared by every repo in the ecosystem so there is
#    one thing to rotate. The installation is scoped to this ecosystem's repos,
#    so a token minted here cannot reach the private monorepo.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a half-applied release PR is worse than a slow one.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Deliberately no write here. Every write below is made with the App's
      # installation token, which carries its own contents/pull-requests/issues
      # grants; leaving GITHUB_TOKEN read-only keeps the Actions identity out of
      # the release path entirely rather than granting it rights it cannot use.
      contents: read
    outputs:
      # The branch of the open release PR, whether or not THIS run touched it.
      # The action's own `pr` output is set only when it wrote something, so a
      # push that leaves an existing PR alone — a `ci:` commit, or a new
      # changelog fragment, neither of which changes the version — reported no
      # PR at all and skipped every maintenance step below. The PR then sits open
      # with fragments unfolded, the VSIX stale and Cargo.lock a version behind,
      # and nothing says so until preflight refuses to publish it.
      head: ${{ steps.target.outputs.head }}
    steps:
      # Exchange the App's signing key for an installation token scoped to this
      # repo, valid one hour. Fails loudly if the App is not installed here.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id, not app-id: the action deprecated the numeric id.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the token to the three grants release-please actually uses. A
          # minted token otherwise inherits everything the installation holds, so
          # without this a permission added to the App later would silently widen
          # every release run.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # release-please reads the commit history through the GitHub API, so there
      # is nothing to check out and nothing to build.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ steps.app-token.outputs.token }}

      # Asked of the repository's state rather than of what this run happened to
      # do. `autorelease: pending` is release-please's own marker for the PR it is
      # holding open — the same label its next run reads to decide whether a
      # release is outstanding — so this is its bookkeeping, not a branch name
      # guessed from a naming convention.
      - id: target
        name: Which branch the open release PR is on
        env:
          PR: ${{ steps.release.outputs.pr }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head=$(python3 -c 'import json, os; print(json.loads(os.environ["PR"] or "{}").get("headBranchName", ""))')
          if [ -z "$head" ]; then
            head=$(gh pr list --repo "$REPO" --state open --label 'autorelease: pending' \
                     --json headRefName --jq '.[0].headRefName // ""')
          fi
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "release PR branch: ${head:-<none open>}"

  # Folds changelog.d/ into CHANGELOG.md on the release PR's own branch, at the
  # exact version release-please just bumped `Cargo.toml` to on that branch —
  # read back through the shared `version` command rather than re-parsed here,
  # so this job agrees with the preflight by construction instead of by two
  # authors keeping two regexes in sync.
  fold-changelog:
    name: fold changelog
    needs: release-please
    if: needs.release-please.outputs.head != ''
    # Keyed on the branch this job writes, not on the ref that triggered it. The
    # workflow group above already serializes runs for one ref, but a
    # `workflow_dispatch` from another ref is outside it and would still find this
    # same open PR — two runs pushing one branch, where the loser is a red X on
    # work the winner already did. Cancelled rather than queued: the survivor
    # reads the branch as it is now.
    concurrency:
      group: fold-changelog-${{ needs.release-please.outputs.head }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The one checkout in this repository that must keep its credentials: the last
      # step below pushes the fold commit back onto the release PR's branch, and it
      # pushes with exactly this token. `persist-credentials: false` would leave that
      # push with nothing to authenticate as. The token is the app's, minted for this
      # job, scoped to contents:write, and revoked when the job ends.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 # zizmor: ignore[artipacked]
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.release-please.outputs.head }}

      - id: version
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: version
          args: --root .

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      # Both interpolations arrive through `env` rather than into the shell text: a
      # release PR's branch name and a version string are data, and a `run:` block that
      # pastes data into its own source is one unlucky character away from being a
      # different script.
      - name: Fold changelog.d fragments into CHANGELOG.md at this PR's version
        env:
          RESULT: ${{ steps.version.outputs.result }}
          BRANCH: ${{ needs.release-please.outputs.head }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json,os; print(json.loads(os.environ["RESULT"])["version"])')
          # Recompute the fold from main rather than appending to whatever this branch
          # already carries. towncrier refuses outright to write a second section for a
          # version it has already written, so an incremental fold is not merely
          # wasteful — a second run over an already-folded branch is a hard error, and
          # `always-update` now rebuilds this branch on every push, so there are many
          # such runs. Taking both paths from main makes the fold a function of main at
          # this version: idempotent when nothing moved, complete when something did.
          # release-please sets `skip-changelog`, so nothing of its own is discarded.
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- CHANGELOG.md changelog.d
          uv run --no-project --python 3.12 --with towncrier==25.8.0 \
            towncrier build --yes --version "$version"
          # towncrier closes the new section with a blank line, and the blank line
          # this file keeps under the marker rides down with the heading it used to
          # precede — so the seam against the previous release lands with two of them,
          # which MD012 rejects. Squeeze that one pair rather than vendoring a fork of
          # towncrier's template: the rendering stays upstream's, and the rest of the
          # file, fenced blocks included, is untouched.
          python3 -c 'import pathlib, re; p = pathlib.Path("CHANGELOG.md"); p.write_text(re.sub(r"\n{3}(?=## \[)", "\n\n", p.read_text(), count=1))'
          # towncrier stages its own edits (newsfile write + fragment removal go
          # through `git add`/`git rm`), so a working-tree-vs-index diff is quiet
          # the instant it finishes even when it rewrote CHANGELOG.md — compare
          # against HEAD, the only ref that predates the build.
          if git diff --quiet HEAD -- CHANGELOG.md changelog.d; then
            echo "nothing new to fold at $version"
            exit 0
          fi
          git config user.name 'billy-company-release[bot]'
          git config user.email 'billy-company-release[bot]@users.noreply.github.com'
          git add CHANGELOG.md changelog.d
          git commit -m "chore(changelog): fold fragments for v$version"
          git push origin "HEAD:$BRANCH"

      # `extra-files` just bumped editors/vscode/package.json's version, but the
      # VSIX released.yml embeds in the zoning executable is a build artifact of
      # that manifest, not a mirror of it — nothing re-packages it just because
      # the version moved. ci.yml's `editors` job diffs the two and fails the
      # instant they part ways, so the release PR must refresh this here or
      # every release would open red on a check nobody told to run again.
      - name: Refresh the deterministic VS Code/Cursor payload
        env:
          BRANCH: ${{ needs.release-please.outputs.head }}
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          npm ci
          npm run package
          if git diff --quiet HEAD -- ../../crates/zoning/src/setup/payload/zoning.vsix; then
            echo "editor payload already matches this version"
            exit 0
          fi
          git config user.name 'billy-company-release[bot]'
          git config user.email 'billy-company-release[bot]@users.noreply.github.com'
          git add ../../crates/zoning/src/setup/payload/zoning.vsix
          git commit -m "chore(editors): refresh the deterministic VS Code/Cursor payload"
          git push origin "HEAD:$BRANCH"

      # release-please's `extra-files` regex-replaces the version string straight
      # into Cargo.toml; it never runs cargo, so Cargo.lock's own pinned entry for
      # the `zoning` package is left one version behind on every bump. Every
      # `cargo … --locked` job downstream (fmt/clippy/test, the editor payload
      # check, the MSRV floor) then refuses to proceed — `--locked` exists
      # precisely to fail instead of silently rewriting a mismatched lockfile.
      # `--precise` touches only that one pinned entry, not a full re-resolve.
      - name: Re-pin Cargo.lock to the bumped version
        env:
          BRANCH: ${{ needs.release-please.outputs.head }}
          RESULT: ${{ steps.version.outputs.result }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json,os; print(json.loads(os.environ["RESULT"])["version"])')
          cargo update -p zoning --precise "$version"
          if git diff --quiet HEAD -- Cargo.lock; then
            echo "Cargo.lock already pinned to $version"
            exit 0
          fi
          git config user.name 'billy-company-release[bot]'
          git config user.email 'billy-company-release[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m "chore: re-pin Cargo.lock to v$version"
          git push origin "HEAD:$BRANCH"
